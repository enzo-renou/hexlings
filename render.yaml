# Déploiement automatique sur Render (Blueprint)
services:
  - type: web
    name: hexlings
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Adresse d'une base Postgres gratuite (Supabase ou Neon) pour garder
      # les comptes et le classement. Sans elle, ils sont perdus à chaque redémarrage.
      - key: DATABASE_URL
        sync: false
